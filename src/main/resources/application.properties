spring.application.name=ecoenergia-api
server.port=8080

# Oracle
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USER:ecoenergia}
spring.datasource.password=${DB_PASSWORD:Eco12345}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA (o schema é gerenciado exclusivamente pelo Flyway)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Segurança / JWT (o segredo deve ter no mínimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:ecoenergia-chave-secreta-para-jwt-com-32-chars-ou-mais}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Usuário administrador criado na primeira execução
app.admin.nome=${ADMIN_NOME:Administrador}
app.admin.email=${ADMIN_EMAIL:admin@ecoenergia.com}
app.admin.senha=${ADMIN_SENHA:Admin@12345}

# Fator médio de emissão do SIN (kg CO2 por kWh) - configurável
app.indicadores.fator-emissao-kg-co2-por-kwh=${FATOR_EMISSAO:0.0617}

management.endpoints.web.exposure.include=health,info
